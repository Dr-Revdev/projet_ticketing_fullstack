info:
  name: PATCH /auth/me/password
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/auth/me/password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{loginPassword}}",
        "newPassword": "{{newPassword}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
