info:
  name: POST /auth/change-password
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "newPassword": "{{newPassword}}"
      }
  auth:
    type: bearer
    token: "{{resetToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
