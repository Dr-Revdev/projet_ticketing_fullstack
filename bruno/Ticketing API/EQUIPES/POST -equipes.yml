info:
  name: POST /equipes
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/equipes"
  body:
    type: json
    data: |-
      {
        "nom": "{{equipeNom}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
