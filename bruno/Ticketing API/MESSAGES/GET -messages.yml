info:
  name: GET /messages
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/messages?id_ticket={{ticketId}}"
  params:
    - name: id_ticket
      value: "{{ticketId}}"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
